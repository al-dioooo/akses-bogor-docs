name: Docs lint

on:
  pull_request:
  push:
    branches: [main, release]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
